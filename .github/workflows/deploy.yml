name: Deploy site

on:
  push:
    branches: [master, main]
    paths:
      - "index*.html"
      - "CV.pdf"
      - "profile.jpg"
      - "support/**"
      - "!support/legacy/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate and prepare static site
        run: python3 support/prepare_site.py
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: support/_site
